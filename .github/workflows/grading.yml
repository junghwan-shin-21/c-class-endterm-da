name: C 프로그래밍 기말고사 (다 반 실습 채점)

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: 통합 채점 스크립트 실행 (100점 만점)
        id: grading
        run: |
          # ANSI 색상 코드 정의
          GREEN='\033[32m'
          RED='\033[31m'
          BLUE='\033[34m'
          NC='\033[0m' # No Color

          # ----------------------------------------------------
          # 1. 초기 변수 설정
          # ----------------------------------------------------
          P1_SCORE=0
          P2_SCORE=0
          P1_FEEDBACK=""
          P2_FEEDBACK=""
          FINAL_SCORE=0

          # Normalize function: Remove all whitespace (spaces, tabs, newlines, carriage returns)
          normalize_output() {
            tr -d ' \t\n\r' < "$1"
          }

          # ====================================================
          # 2. 문제 1 채점 (비트 조작 + 파일 I/O - main-1.c) - 50점
          # ====================================================
          echo -e "\n${BLUE}--- [TEST P1] 실습 1 채점 시작 (main-1.c) ---${NC}"

          # 2-1. 컴파일 시도
          if gcc main-1.c -o main1 2> compile_error_p1.txt; then
            echo -e "${GREEN}[OK]${NC} 문제 1: 컴파일 성공."

            # 2-2. 입력 파일(source.txt) 생성
            #      학생 코드는 이 파일에서 3개의 값을 읽어야 함
            printf "입력 변수: 0x330a 0x751d 0x1aae\n" > source.txt

            # 2-3. 프로그램 실행 (result.txt 생성 기대)
            ./main1 > actual_p1_raw.txt 2> runtime_error_p1.txt

            # 2-4. result.txt 존재 여부 확인
            if [ ! -f "result.txt" ]; then
              P1_FEEDBACK="${RED}[FAIL]${NC} 문제 1 (파일 비트 조작): 결과 파일(result.txt)이 생성되지 않았습니다."
            else
              # 2-5. result.txt에서 16진수 3개만 추출하여 비교
              #      기대 값: 0x3B0A 0x7D1D 0x122E
              EXPECTED_HEX="0x3B0A 0x7D1D 0x122E"

              # result.txt에서 '0x'로 시작하는 토큰을 3개 추출
              ACTUAL_HEX=$(grep -o '0x[0-9a-fA-F]\+' result.txt | head -n 3 | tr '\n' ' ')
              ACTUAL_HEX=$(echo "$ACTUAL_HEX" | sed 's/[[:space:]]\+$//')

              # 대소문자 무시 비교를 위해 둘 다 소문자로 변환
              ACTUAL_HEX_LOWER=$(echo "$ACTUAL_HEX"     | tr 'A-F' 'a-f')
              EXPECTED_HEX_LOWER=$(echo "$EXPECTED_HEX" | tr 'A-F' 'a-f')

              if [ "$ACTUAL_HEX_LOWER" = "$EXPECTED_HEX_LOWER" ]; then
                P1_SCORE=50
                P1_FEEDBACK="${GREEN}[OK]${NC} 문제 1 (파일 비트 조작): 통과 (50점)"
              else
                P1_FEEDBACK="${RED}[FAIL]${NC} 문제 1 (파일 비트 조작): 실패."
                P1_FEEDBACK="${P1_FEEDBACK}\n  [학생 result.txt 내 숫자 3개]: $ACTUAL_HEX"
                P1_FEEDBACK="${P1_FEEDBACK}\n  [기대하는 숫자 3개]: $EXPECTED_HEX"
              fi
            fi
          else
            echo -e "${RED}[FAIL]${NC} 문제 1: 컴파일 실패."
            P1_FEEDBACK="${RED}[FAIL]${NC} 문제 1 (파일 비트 조작): 컴파일 실패. 코드를 확인하세요."
          fi

          # ====================================================
          # 3. 문제 2 채점 (구조체 + 파일 I/O - main-2.c) - 50점
          # ====================================================
          echo -e "\n${BLUE}--- [TEST P2] 실습 2 채점 시작 (main-2.c) ---${NC}"

          # 3-1. 컴파일 시도
          if gcc main-2.c -o main2 2> compile_error_p2.txt; then
            echo -e "${GREEN}[OK]${NC} 문제 2: 컴파일 성공."

            # 3-2. 입력 파일(fruits.txt) 생성
            #      학생 코드는 이 파일에서 5개의 과일 정보를 읽어야 함
            {
              printf "Apple Red 20000\n"
              printf "Banana Yellow 15000\n"
              printf "Melon Green 32000\n"
              printf "Grape Purple 22000\n"
              printf "Kiwi Brown 19000\n"
            } > fruits.txt

            # 3-3. 프로그램 실행 (fruit_info.txt 생성 기대)
            ./main2 > actual_p2_raw.txt 2> runtime_error_p2.txt

            # 3-4. fruit_info.txt 존재 여부 확인
            if [ ! -f "fruit_info.txt" ]; then
              P2_FEEDBACK="${RED}[FAIL]${NC} 문제 2 (구조체 과일 정보): 결과 파일(fruit_info.txt)이 생성되지 않았습니다."
            else
              # 3-5. fruit_info.txt 내용 비교
              # 기대 내용:
              # offset: 1
              # name: Banana
              # color: Yellow
              # price: 15000
              cat > expected_p2.txt << 'EOF'
               offset: 1
               name: Banana
               color: Yellow
               price: 15000
              EOF

              # 실제 출력 정규화 (공백/개행 제거) 비교
              if [[ "$(normalize_output fruit_info.txt)" == "$(normalize_output expected_p2.txt)" ]]; then
                P2_SCORE=50
                P2_FEEDBACK="${GREEN}[OK]${NC} 문제 2 (구조체 과일 정보): 통과 (50점)"
              else
                P2_FEEDBACK="${RED}[FAIL]${NC} 문제 2 (구조체 과일 정보): 출력 형식 또는 내용이 다릅니다."
                P2_FEEDBACK="${P2_FEEDBACK}\n  [학생 fruit_info.txt]: $(cat fruit_info.txt | tr '\n' ' ')"
                P2_FEEDBACK="${P2_FEEDBACK}\n  [예상 출력]: $(cat expected_p2.txt | tr '\n' ' ')"
              fi
            fi
          else
            echo -e "${RED}[FAIL]${NC} 문제 2: 컴파일 실패."
            P2_FEEDBACK="${RED}[FAIL]${NC} 문제 2 (구조체 과일 정보): 컴파일 실패. 코드를 확인하세요."
          fi

          # ----------------------------------------------------
          # 4. 최종 점수 및 피드백 계산
          # ----------------------------------------------------
          FINAL_SCORE=$((P1_SCORE + P2_SCORE))

          FULL_FEEDBACK="--- 최종 채점 결과 (총 ${FINAL_SCORE}점 / 100점) ---\n"
          FULL_FEEDBACK="${FULL_FEEDBACK}\n${P1_FEEDBACK}"
          FULL_FEEDBACK="${FULL_FEEDBACK}\n${P2_FEEDBACK}"

          # 5. GitHub Classroom 출력 (점수 및 피드백 전달)
          echo "점수: ${FINAL_SCORE} / 100"
          echo "피드백:\n"
          echo -e "$FULL_FEEDBACK"

          echo "score=$FINAL_SCORE" >> "$GITHUB_OUTPUT"
          echo "feedback<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$FULL_FEEDBACK" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # 6. 최종 실패 보장 로직 (원하시면 조건 제거 가능)
          if [ "$FINAL_SCORE" -ne 100 ]; then
            echo "::error::[ERROR] 최종 점수가 100점이 아니므로 채점 실패 처리합니다."
            exit 1
          fi
